<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Try Out TKA</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: layar identitas dua panel -> ruang ujian (bacaan kiri, soal kanan, navigasi nomor di sisi) -> halaman hasil dengan skor dan pembahasan.
   Warna: indigo-violet sebagai merek; matahari, koral, teal sebagai aksen; hijau/kuning/abu-abu untuk status nomor soal. */
:root{
  --bg:#F2F1FF; --surface:#FFFFFF; --surface-2:#F7F6FF; --ink:#1C1A3F; --muted:#5E5B8A; --line:#DEDBF5;
  --brand:#4A3FE4; --brand-d:#3329B8; --brand-soft:#E8E6FF; --on-brand:#FFFFFF;
  --hero-a:#3A2FD0; --hero-b:#7A4DF5;
  --sun:#FFC83D; --coral:#FF6A5C; --teal:#14B8A6; --on-sun:#2A1B00;
  --ok:#0B8A5C; --ok-soft:#DCF5EA; --on-ok:#FFFFFF;
  --doubt:#F5A524; --doubt-soft:#FFF0CF; --on-doubt:#3B2500;
  --bad:#D9363E; --bad-soft:#FFE4E4;
  --crit:#E5383B;
  --shadow:0 1px 2px rgba(40,30,120,.06),0 10px 28px rgba(40,30,120,.09);
  --f-display:"Bricolage Grotesque","Plus Jakarta Sans",system-ui,sans-serif;
  --f-body:"Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-read:"Lora",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F0E26; --surface:#1A1940; --surface-2:#232250; --ink:#EDECFF; --muted:#ABA9D8; --line:#36356F;
  --brand:#8F86FF; --brand-d:#B7B1FF; --brand-soft:#2B2968; --on-brand:#14123A;
  --hero-a:#2A2290; --hero-b:#5B33C9;
  --ok:#2BC48A; --ok-soft:#12372C; --on-ok:#052A1D;
  --doubt:#FFB52E; --doubt-soft:#3A2D10; --on-doubt:#2D1C00;
  --bad:#FF7B80; --bad-soft:#40181D;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F0E26; --surface:#1A1940; --surface-2:#232250; --ink:#EDECFF; --muted:#ABA9D8; --line:#36356F;
  --brand:#8F86FF; --brand-d:#B7B1FF; --brand-soft:#2B2968; --on-brand:#14123A;
  --hero-a:#2A2290; --hero-b:#5B33C9;
  --ok:#2BC48A; --ok-soft:#12372C; --on-ok:#052A1D;
  --doubt:#FFB52E; --doubt-soft:#3A2D10; --on-doubt:#2D1C00;
  --bad:#FF7B80; --bad-soft:#40181D;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px rgba(0,0,0,.35);
  color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--hero-a)}
button{font:inherit;color:inherit;cursor:pointer}
input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px}
.in{width:100%;max-width:1240px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;line-height:1.1}
.ico{display:inline-flex;flex:none}
.ico svg{width:1.25em;height:1.25em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* tombol */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5em;min-height:46px;padding:0 20px;border-radius:12px;border:2px solid transparent;font-weight:700;font-size:.97rem;transition:transform .12s,background .15s,border-color .15s}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--brand);color:var(--on-brand)}
.btn-primary:hover:not([disabled]){background:var(--brand-d);color:var(--on-brand)}
.btn-ghost{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn-ghost:hover:not([disabled]){border-color:var(--brand)}
.btn-doubt{background:var(--surface);border-color:var(--doubt);color:var(--ink)}
.btn-doubt:hover{background:var(--doubt-soft)}
.btn-doubt.on{background:var(--doubt);color:var(--on-doubt)}
.btn-ok{background:var(--ok);color:var(--on-ok)}
.btn-sun{background:var(--sun);color:var(--on-sun)}
.link{background:none;border:0;padding:4px 0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;font-size:.88rem}
.link:hover{color:var(--ink)}

/* ===== layar identitas ===== */
.welcome{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:28px;padding-block:clamp(16px,4vw,44px);align-items:stretch}
.hero{position:relative;overflow:hidden;border-radius:28px;padding:clamp(24px,4vw,48px);color:#fff;background:linear-gradient(140deg,var(--hero-a),var(--hero-b));display:flex;flex-direction:column;gap:22px;isolation:isolate}
.hero .shape{position:absolute;z-index:-1;border-radius:50%}
.hero .s1{width:260px;height:260px;right:-70px;top:-80px;background:var(--sun);opacity:.95}
.hero .s2{width:150px;height:150px;right:60px;bottom:-60px;background:var(--coral)}
.hero .s3{width:90px;height:90px;left:-30px;bottom:140px;background:var(--teal);border-radius:26px;transform:rotate(18deg)}
.kicker{display:inline-flex;align-self:flex-start;gap:8px;align-items:center;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.28);padding:6px 14px;border-radius:99px;font-weight:700;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase}
.hero h1{font-size:clamp(2.6rem,6vw,4.4rem);font-weight:800;letter-spacing:-.02em}
.hero h1 small{display:block;font-size:.38em;font-weight:600;letter-spacing:0;margin-top:.5em;opacity:.92}
.facts{display:flex;flex-wrap:wrap;gap:10px}
.fact{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);border-radius:16px;padding:10px 16px;min-width:96px}
.fact b{display:block;font-family:var(--f-display);font-size:1.7rem;line-height:1.1}
.fact span{font-size:.8rem;opacity:.9}
.rules{margin:0;padding:0;list-style:none;display:grid;gap:10px;max-width:46ch}
.rules li{display:flex;gap:10px;font-size:.95rem}
.rules li i{flex:none;width:22px;height:22px;border-radius:50%;background:#fff;color:var(--hero-a);display:grid;place-items:center;font-style:normal;font-weight:800;font-size:.75rem;margin-top:1px}
.legend-mini{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto}
.chip{display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:99px;font-size:.82rem;font-weight:700}
.chip i{width:14px;height:14px;border-radius:5px;display:block}
.hero .chip{background:rgba(255,255,255,.95);color:#1C1A3F}
.formcard{background:var(--surface);border:1px solid var(--line);border-radius:28px;box-shadow:var(--shadow);padding:clamp(22px,3.5vw,40px);display:flex;flex-direction:column;gap:18px}
.formcard h2{font-size:1.8rem;font-weight:800}
.formcard p.lead{margin:6px 0 0;color:var(--muted)}
.field{display:grid;gap:6px}
.field label{font-weight:700;font-size:.9rem}
.field input{height:50px;border-radius:12px;border:2px solid var(--line);background:var(--surface-2);padding:0 14px;width:100%;min-width:0}
.field input:focus{outline:none;border-color:var(--brand);background:var(--surface)}
.field input[aria-invalid="true"]{border-color:var(--bad)}
.field .err{color:var(--bad);font-size:.84rem;font-weight:600;min-height:0}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.formcard .btn-primary{min-height:54px;font-size:1.05rem;margin-top:4px}
.fine{font-size:.82rem;color:var(--muted);margin:0}

/* ===== ruang ujian ===== */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:linear-gradient(100deg,var(--hero-a),var(--hero-b));color:#fff;box-shadow:0 4px 18px rgba(30,20,120,.25)}
.top .in{display:flex;align-items:center;gap:14px;min-height:66px;padding-block:8px}
.logo{display:flex;align-items:center;gap:12px;min-width:0}
.logo .mark{flex:none;width:40px;height:40px;border-radius:12px;background:var(--sun);color:var(--on-sun);display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:1rem}
.logo b{display:block;font-family:var(--f-display);font-size:1.15rem;line-height:1.1}
.logo span.s{display:block;font-size:.78rem;opacity:.88;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who{margin-left:auto;text-align:right;min-width:0;font-size:.85rem;line-height:1.3}
.who b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:26ch;margin-left:auto}
.who span{opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;max-width:26ch;margin-left:auto}
.timer{flex:none;display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);border-radius:14px;padding:6px 14px 6px 12px}
.timer .t{font-family:var(--f-display);font-weight:800;font-size:1.5rem;font-variant-numeric:tabular-nums;line-height:1}
.timer small{display:block;font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;opacity:.9;line-height:1.1}
.timer.warn{background:var(--sun);color:var(--on-sun);border-color:var(--sun)}
.timer.crit{background:var(--crit);border-color:var(--crit);color:#fff;animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.04)}}
.progress{height:5px;background:rgba(255,255,255,.22)}
.progress i{display:block;height:100%;background:var(--sun);width:0;transition:width .3s}
.exam{display:grid;grid-template-columns:minmax(0,1fr) 312px;gap:22px;padding-block:22px 28px;align-items:start}
.qcol{display:flex;flex-direction:column;gap:14px;min-width:0}
.qcard{background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);overflow:hidden}
.qhead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 22px;border-bottom:1px solid var(--line);background:var(--surface-2);flex-wrap:wrap}
.qno{display:flex;align-items:baseline;gap:10px}
.qnum{font-family:var(--f-display);font-weight:800;font-size:2rem;line-height:1;color:var(--brand)}
.qof{color:var(--muted);font-weight:600;font-size:.9rem}
.status{display:inline-flex;align-items:center;gap:7px;border-radius:99px;padding:5px 12px;font-size:.8rem;font-weight:700;background:var(--surface);border:1.5px solid var(--line);color:var(--muted)}
.status i{width:10px;height:10px;border-radius:4px;background:var(--line)}
.status.done{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.status.done i{background:var(--ok)}
.status.doubt{background:var(--doubt-soft);border-color:var(--doubt);color:var(--ink)}
.status.doubt i{background:var(--doubt)}
.qbody{padding:22px;display:grid;gap:20px;min-width:0}
.qbody.split{grid-template-columns:minmax(0,1fr)}
.stimwrap{min-width:0}
.stimlabel{display:flex;align-items:center;gap:8px;font-size:.78rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--brand);margin-bottom:8px}
.stimlabel::before{content:"";width:22px;height:4px;border-radius:4px;background:var(--coral)}
.stim{background:var(--surface-2);border:1px solid var(--line);border-radius:16px;padding:18px 20px;font-family:var(--f-read);font-size:1.03rem;line-height:1.75;overflow-wrap:anywhere}
.stim .ttl{font-family:var(--f-display);font-size:1.35rem;font-weight:800;margin-bottom:2px;line-height:1.2}
.stim .au{font-style:italic;color:var(--muted);margin:0 0 14px}
.stim .stz{margin:0 0 1em}
.stim .stz:last-child{margin-bottom:0}
.stim .lbl{font-family:var(--f-body);font-weight:800;font-size:.85rem;color:var(--brand);margin:0 0 4px}
.stim p.pr{margin:0 0 .8em}
.stim p.pr:last-child{margin-bottom:0}
.stim .dl{display:flex;gap:.7em;margin:0 0 .45em}
.stim .dl b{flex:0 0 5.2em;font-family:var(--f-body);font-weight:700;font-size:.9rem;color:var(--brand);padding-top:.12em}
.stim .dl span{flex:1;min-width:0}
.stim .sd{font-style:italic;color:var(--muted);margin:.5em 0}
.stim .src{font-family:var(--f-body);font-size:.75rem;color:var(--muted);margin:14px 0 0;padding-top:10px;border-top:1px dashed var(--line);overflow-wrap:anywhere}
.stem{font-weight:700;font-size:1.08rem;line-height:1.55;margin:0 0 14px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:14px;align-items:flex-start;text-align:left;width:100%;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:12px 16px;transition:border-color .12s,background .12s}
.opt:hover{border-color:var(--brand)}
.opt .lt{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:800;background:var(--brand-soft);color:var(--brand);transition:background .12s,color .12s}
.opt .tx{flex:1;min-width:0;padding-top:4px;overflow-wrap:anywhere}
.opt.sel{border-color:var(--brand);background:var(--brand-soft)}
.opt.sel .lt{background:var(--brand);color:var(--on-brand)}
.clear{margin-top:8px}
.actions{position:sticky;bottom:max(10px,env(safe-area-inset-bottom,0px));z-index:20;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr) minmax(0,1fr);gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:10px;box-shadow:0 10px 30px rgba(30,20,120,.18)}
.actions .btn{width:100%;white-space:nowrap;min-width:0}
.ncol{position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px);display:flex;flex-direction:column;gap:14px}
.ncard{background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);padding:18px}
.ncard h2{font-size:1.1rem;font-weight:800;margin-bottom:12px;display:flex;justify-content:space-between;align-items:baseline}
.ncard h2 span{font-family:var(--f-body);font-size:.82rem;color:var(--muted);font-weight:600}
.ngrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.n{position:relative;aspect-ratio:1;min-height:42px;border-radius:12px;border:2px solid var(--line);background:var(--surface-2);color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums;display:grid;place-items:center;padding:0;transition:transform .1s}
.n:hover{transform:translateY(-2px);border-color:var(--brand)}
.n.done{background:var(--ok);border-color:var(--ok);color:var(--on-ok)}
.n.doubt{background:var(--doubt);border-color:var(--doubt);color:var(--on-doubt)}
.n.doubt::after{content:"";position:absolute;top:3px;right:3px;width:0;height:0;border-style:solid;border-width:0 9px 9px 0;border-color:transparent var(--on-doubt) transparent transparent;opacity:.55}
.n.cur{outline:3px solid var(--brand);outline-offset:2px}
.leg{display:grid;gap:8px;margin:14px 0 0;padding:0;list-style:none;font-size:.86rem;font-weight:600}
.leg li{display:flex;align-items:center;gap:10px}
.leg i{width:20px;height:20px;border-radius:7px;border:2px solid var(--line);background:var(--surface-2);flex:none}
.leg i.done{background:var(--ok);border-color:var(--ok)}
.leg i.doubt{background:var(--doubt);border-color:var(--doubt)}
.leg i.cur{border:3px solid var(--brand);background:var(--surface)}
.leg b{margin-left:auto;font-variant-numeric:tabular-nums}
.ncol .btn-ok{width:100%;min-height:52px}

/* ===== modal ===== */
.ov{position:fixed;inset:0;z-index:100;background:rgba(15,10,60,.6);display:grid;place-items:center;padding:16px}
.ov[hidden]{display:none}
.dlg{background:var(--surface);border-radius:24px;padding:26px;max-width:460px;width:100%;box-shadow:0 30px 80px rgba(0,0,0,.4);display:grid;gap:14px}
.dlg h2{font-size:1.5rem;font-weight:800}
.dlg p{margin:0;color:var(--muted)}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sum div{border-radius:14px;padding:10px;text-align:center;font-size:.8rem;font-weight:700}
.sum b{display:block;font-family:var(--f-display);font-size:1.8rem;line-height:1.1}
.sum .a{background:var(--ok-soft);color:var(--ok)}
.sum .b{background:var(--doubt-soft);color:var(--ink)}
.sum .c{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.dlg .btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}

/* ===== hasil ===== */
.rhero{background:linear-gradient(120deg,var(--hero-a),var(--hero-b));color:#fff;padding-block:max(24px,3vw) 80px}
.rhero .in{display:flex;align-items:center;gap:12px}
.rhero .logo{flex:1}
.res{margin-top:-56px;display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:20px;align-items:stretch}
.scorecard{background:var(--surface);border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow);padding:26px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px}
.scorecard .cap{font-weight:800;font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ring{position:relative;width:188px;height:188px}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:16;stroke-linecap:round}
.ring .bg{stroke:var(--line)}
.ring .fg{animation:fill 1.1s ease-out both}
@keyframes fill{from{stroke-dashoffset:var(--circ)}}
.ring .num{position:absolute;inset:0;display:grid;place-content:center;font-family:var(--f-display);font-weight:800;font-size:3.4rem;line-height:1;font-variant-numeric:tabular-nums}
.ring .num small{display:block;font-family:var(--f-body);font-size:.75rem;color:var(--muted);font-weight:700;margin-top:6px}
.pred{display:inline-block;border-radius:99px;padding:6px 16px;font-weight:800;font-size:.95rem}
.p-hi{background:var(--ok-soft);color:var(--ok)}
.p-mid{background:var(--doubt-soft);color:var(--ink)}
.p-lo{background:var(--bad-soft);color:var(--bad)}
.info{background:var(--surface);border:1px solid var(--line);border-radius:26px;box-shadow:var(--shadow);padding:26px;display:grid;gap:20px;align-content:start}
.info h2{font-size:1.4rem;font-weight:800}
.idl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 22px;margin:0}
.idl div{min-width:0}
.idl dt{font-size:.74rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.idl dd{margin:2px 0 0;font-weight:700;font-size:1.05rem;overflow-wrap:anywhere}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.stat{border-radius:16px;padding:12px 14px;font-weight:700;font-size:.85rem}
.stat b{display:block;font-family:var(--f-display);font-size:2rem;line-height:1.1}
.stat.ok{background:var(--ok-soft);color:var(--ok)}
.stat.no{background:var(--bad-soft);color:var(--bad)}
.stat.bl{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr));gap:7px}
.map a{aspect-ratio:1;border-radius:11px;display:grid;place-items:center;font-weight:800;font-size:.9rem;text-decoration:none;border:2px solid transparent;font-variant-numeric:tabular-nums}
.map a.ok{background:var(--ok);color:var(--on-ok)}
.map a.no{background:var(--bad);color:#fff}
.map a.bl{background:var(--surface-2);color:var(--muted);border-color:var(--line)}
.map a:hover{transform:translateY(-2px)}
.pbh{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px;margin:34px 0 16px}
.pbh h2{font-size:clamp(1.6rem,3vw,2.2rem);font-weight:800}
.filters{display:flex;flex-wrap:wrap;gap:8px}
.filters button{border:2px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 16px;font-weight:700;font-size:.88rem}
.filters button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--on-brand)}
.pb{background:var(--surface);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);margin-bottom:16px;overflow:hidden;scroll-margin-top:16px}
.pb-h{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center;padding:12px 20px;background:var(--surface-2);border-bottom:1px solid var(--line)}
.pb-h .nm{font-family:var(--f-display);font-size:1.6rem;font-weight:800;color:var(--brand);line-height:1}
.tag{border-radius:99px;padding:3px 12px;font-size:.78rem;font-weight:800}
.tag.ok{background:var(--ok);color:var(--on-ok)}
.tag.no{background:var(--bad);color:#fff}
.tag.bl{background:var(--surface);border:1.5px solid var(--line);color:var(--muted)}
.pb-h .ans{margin-left:auto;font-size:.85rem;font-weight:600;color:var(--muted)}
.pb-h .ans b{color:var(--ink)}
.pb-b{padding:20px;display:grid;gap:16px}
.pb details summary{cursor:pointer;font-weight:700;font-size:.9rem;color:var(--brand);padding:4px 0;list-style:none;display:flex;align-items:center;gap:8px}
.pb details summary::-webkit-details-marker{display:none}
.pb details summary::before{content:"▸";transition:transform .15s}
.pb details[open] summary::before{transform:rotate(90deg)}
.pb details .stim{margin-top:8px}
.ropts{display:grid;gap:8px}
.ro{display:flex;gap:12px;align-items:flex-start;border:2px solid var(--line);border-radius:12px;padding:9px 14px;font-size:.96rem}
.ro .lt{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:.9rem;background:var(--brand-soft);color:var(--brand)}
.ro .tx{flex:1;min-width:0;padding-top:3px;overflow-wrap:anywhere}
.ro .mk{flex:none;font-size:.72rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding-top:6px;white-space:nowrap}
.ro.key{border-color:var(--ok);background:var(--ok-soft)}
.ro.key .lt{background:var(--ok);color:var(--on-ok)}
.ro.key .mk{color:var(--ok)}
.ro.wrong{border-color:var(--bad);background:var(--bad-soft)}
.ro.wrong .lt{background:var(--bad);color:#fff}
.ro.wrong .mk{color:var(--bad)}
.expl{border-radius:16px;background:var(--brand-soft);padding:14px 18px;border-left:6px solid var(--brand)}
.expl h3{font-family:var(--f-body);font-size:.8rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--brand);margin-bottom:6px}
.expl p{margin:0}
.bottom{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;padding-block:14px 48px}
.empty{padding:34px;text-align:center;color:var(--muted);border:2px dashed var(--line);border-radius:20px}

@media (min-width:1180px){
  .qbody.split{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}
  .qbody.split .stimwrap{position:sticky;top:calc(env(safe-area-inset-top,0px) + 90px);max-height:calc(100vh - 220px);overflow:auto;border-radius:16px}
}
@media (max-width:980px){
  .welcome{grid-template-columns:1fr}
  .exam{grid-template-columns:1fr}
  .ncol{position:static}
  .ngrid{grid-template-columns:repeat(auto-fill,minmax(46px,1fr))}
  .res{grid-template-columns:1fr}
  .who{display:none}
  .logo{flex:1}
}
@media (max-width:560px){
  .row2{grid-template-columns:1fr}
  .logo span.s{display:none}
  .timer .t{font-size:1.25rem}
  .timer small{display:none}
  .qbody{padding:16px}
  .qhead{padding:12px 16px}
  .actions .btn{padding:0 6px;font-size:.85rem;min-height:48px;gap:.3em}
  .actions .ico svg{width:1em;height:1em}
  .actions .btn .lab-long{display:none}
  .idl{grid-template-columns:1fr}
  .stim .dl b{flex-basis:4.4em}
  .pb-h .ans{margin-left:0;width:100%}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}

asi puisi bertujuan menggantikan peran teks puisi dengan unsur musik agar lebih komunikatif.", "Musikalisasi puisi bertujuan memperkuat penghayatan dan pemaknaan puisi melalui keselarasan antara unsur musik dan teks.", "Musikalisasi puisi hanya berfungsi sebagai hiburan tanpa berkaitan dengan penyampaian pesan puisi."], "key": "D", "pem": "Musikalisasi puisi bertujuan memperkuat penghayatan dan pemaknaan puisi melalui keselarasan musik dan teks. Kelompok pertama berhasil karena musiknya selaras, sedangkan kelompok kedua gagal karena musik mengalahkan makna."}, {"n": 18, "inst": "Bacalah narasi berikut!", "kind": "prose", "stim": ["Dalam sebuah kegiatan literasi, siswa diminta membandingkan dua karya yang membahas isu sosial. Karya pertama berupa puisi yang menggunakan majas dan simbol untuk menyampaikan kritik terhadap ketidakadilan sosial secara halus, namun mampu menggugah emosi pembaca. Karya kedua berupa artikel yang menyajikan data lengkap dan penjelasan rinci mengenai masalah sosial tersebut, tetapi kurang menarik perhatian pembaca secara emosional."], "stem": "Berdasarkan kedua karya dalam narasi tersebut, manakah penilaian yang paling tepat mengenai efektivitas puisi sebagai media kritik sosial?", "opts": ["Puisi lebih efektif karena menyampaikan pesan secara halus namun memiliki kekuatan makna yang mendalam.", "Puisi kurang efektif karena tidak menyampaikan pesan secara langsung kepada pembaca secara jelas.", "Puisi tidak efektif karena tidak menyajikan data lengkap mengenai kondisi sosial masyarakat secara menyeluruh.", "Puisi kurang efektif karena tidak menjelaskan masalah sosial secara rinci dan sistematis kepada pembaca.", "Puisi tidak efektif karena tidak menyampaikan peristiwa sosial secara kronologis kepada pembaca secara runtut."], "key": "A", "pem": "Dalam narasi, puisi menyampaikan kritik secara halus lewat majas dan simbol, tetapi tetap menggugah emosi. Itu menunjukkan kekuatan puisi sebagai media kritik sosial, sedangkan artikel yang kering kurang menyentuh pembaca."}, {"n": 19, "inst": "Cermati dua penggalan puisi berikut!", "kind": "poem", "stim": ["Puisi 1:", "Langit senja berwarna luka,", "kata-kata menari dalam sunyi,", "membingkai rasa tanpa suara.", "Puisi 2:", "Di jalanan kota penuh debu,", "suara rakyat terbungkam waktu,", "menuntut hak yang lama layu."], "stem": "Seorang kritikus sastra menilai bahwa kedua puisi tersebut memiliki penekanan fungsi yang berbeda. Berdasarkan analisis fungsi puisi, manakah pernyataan yang paling tepat untuk mengevaluasi perbedaan fungsi estetis dan fungsi sosial pada kedua puisi tersebut?", "opts": ["Fungsi estetis menonjolkan keindahan bahasa puitis, sedangkan fungsi sosial menonjolkan kritik terhadap kehidupan masyarakat.", "Fungsi estetis menonjolkan penyampaian fakta secara langsung, sedangkan fungsi sosial menonjolkan penggunaan bahasa yang imajinatif.", "Fungsi estetis menonjolkan struktur dan panjang puisi, sedangkan fungsi sosial menonjolkan pilihan kata dalam puisi.", "Fungsi estetis menonjolkan peran pembaca dalam memahami puisi, sedangkan fungsi sosial menonjolkan peran penyair dalam berkarya.", "Fungsi estetis menonjolkan isi puisi secara keseluruhan, sedangkan fungsi sosial menonjolkan bentuk dan tipografi puisi."], "key": "A", "pem": "Puisi 1 menonjolkan keindahan bahasa puitis (“langit senja berwarna luka”, “kata-kata menari”), yaitu fungsi estetis. Puisi 2 mengkritik kondisi rakyat yang terbungkam, yaitu fungsi sosial."}, {"n": 20, "inst": "Cermati pernyataan berikut!", "kind": "prose", "stim": ["Seorang siswa menulis puisi tentang keresahan sosial, tetapi puisinya dinilai kurang menarik karena pilihan katanya datar, kurang imajinatif, dan tidak mampu menggugah perasaan pembaca. Guru kemudian meminta siswa tersebut mengevaluasi kembali karyanya agar menjadi puisi yang lebih berkualitas."], "stem": "Berdasarkan kondisi tersebut, manakah kriteria paling tepat yang harus dipenuhi agar puisi yang dihasilkan menjadi lebih baik?", "opts": ["Mengolah bahasa ngan sampai ketakutan mengendalikan hidupmu.\""}, {"s": "Raka", "t": "(menunduk) \"Kamu tidak mengerti. Aku punya banyak yang harus dipertaruhkan.\""}, {"s": "Dina", "t": "\"Aku mengerti, Rak. Tapi justru karena itu, kamu harus berani mengambil langkah.\""}, {"s": "Raka", "t": "\"Bagaimana kalau semuanya berakhir buruk?\""}, {"s": "Dina", "t": "(mendekat) \"Kadang, untuk mendapatkan sesuatu yang besar, kita harus berani kehilangan terlebih dahulu.\""}, {"s": "Raka", "t": "(diam sejenak, lalu tersenyum tipis) \"Kamu selalu punya cara untuk meyakinkanku.\""}, {"s": "Dina", "t": "\"Aku hanya ingin kamu tidak menyesal di kemudian hari.\""}, {"s": "Raka", "t": "(menatap Dina) \"Baiklah… aku akan ikut denganmu. Apa pun yang terjadi.\""}, {"s": "Dina", "t": "(tersenyum lega) \"Terima kasih, Rak. Kita hadapi bersama.\""}, "(Lampu perlahan redup. Mereka berjalan keluar panggung.)", "Sumber : https://www.facebook.com/groups/912480212703225/posts/1931474854137084/"], "stem": "Keterkaitan antara tema dan alur dalam drama tersebut adalah….", "opts": ["alur tidak mendukung tema melalui konflik batin tokoh", "alur memperkuat tema melalui konflik batin tokoh", "tema tidak terlihat dalam alur pada penggalan drama tersebut", "alur hanya sebagai pelengkap dalam konflik drama tersebut", "tema bertentangan dengan alur dan tidak tergambar jelas"], "key": "B", "pem": "Tema drama adalah keberanian mengambil keputusan di tengah ketakutan. Tema ini dikuatkan oleh alur yang bergerak dari keraguan Raka menuju keputusannya melalui konflik batin."}, {"n": 23, "inst": "Bacalah penggalan teks drama berikut dengan saksama !", "kind": "drama", "stim": ["Jalan yang Berbeda", {"s": "Rina", "t": "\"Ayah, aku ingin melanjutkan kuliah ke luar kota.\""}, {"s": "Ayah", "t": "(menurunkan koran) \"Untuk apa jauh-jauh? Di sini juga ada kampus.\""}, {"s": "Rina", "t": "\"Aku ingin mengejar impianku, Yah. Jurusan itu tidak ada di sini.\""}, {"s": "Ayah", "t": "\"Kamu itu perempuan. Tidak perlu jauh-jauh. Nanti ipertimbangkan ya.\""}, {"s": "Bu Made", "t": "\"Justru itulah indahnya keberagaman, kita bisa saling melengkapi.\""}, "(Semua mengangguk setuju).", "Sumber : https://share.google/aimode/xxSlwHzo9NpyKQjc4"], "stem": "Perhatian terhadap waktu ibadah menunjukkan adanya penghargaan terhadap keberagaman….", "opts": ["profesi", "adat istiadat", "agama", "etnis", "sosial"], "key": "C", "pem": "Waktu ibadah berkaitan dengan agama. Rina meminta acara tidak bertabrakan dengan waktu ibadah, yang berarti menghargai keberagaman agama."}, {"n": 25, "inst": "Bacalah penggalan teks drama berikut dengan saksama !", "kind": "drama", "stim": ["Harmoni dalam Perbedaan", {"s": "Pak Hasan", "t": "\"Kita akan mengadakan acara besar. Semua warga harus terlibat.\""}, {"s": "Bu Made", "t": "\"Betul, tapi kita harus mempertimbangkan keberagaman di desa ini.\""}, {"s": "Pak Budi", "t": "\"Maksudnya?\""}, {"s": "Bu Made", "t": "\"Di desa kita ada berbagai etnis, agama, dan profesi. Kita harus menghargai semuanya.\""}, {"s": "Rina", "t": "\"Saya setuju. Misalnya dalam acara, jangan sampai bertabrakan dengan waktu ibadah.\""}, {"s": "Pak Hasan", "t": "\"Benar juga. Kita harus atur jadwal dengan baik.\""}, {"s": "Pak Joko", "t": "\"Selain itu, kita bisa menampilkan tarian dari berbagai daerah sebagai bentuk keberagaman etnis.\""}, {"s": "Bu Sari", "t": "\"Dan makanan yang disajikan juga harus memperhatikan adat dan kepercayaan masing-masing.\""}, {"s": "Pak Budi", "t": "\"Wah, ternyata banyak yang harus dipertimbangkan ya.\""}, {"s": "Bu Made", "t": "\"Justru itulah indahnya keberagaman, kita bisa saling melengkapi.\""}, "(Semua mengangguk setuju).", "Sumber : https://share.google/aimode/xxSlwHzo9NpyKQjc4"], "stem": "Makna yang terkandung dalam pernyataan “keberagaman dapat saling melengkapi” adalah….", "opts": ["perbedaan harus dihindari", "perbedaan adalah kelemahan", "keberagaman merupakan kekuatan sosial", "semua harus sama", "tidak perlu aturan"], "key": "C", "pem": "“Saling melengkapi” berarti perbedaan menjadi kekuatan jika disatukan. Maknanya adalah keberagaman merupakan kekuatan sosial."}, {"n": 26, "inst": "Bacalah penggalan teks drama berikut dengan saksama !", "kind": "drama", "stim": ["Satu Meja, Banyak Cerita", {"s": "Andi", "t": "\"Eh, kalian bawa makanan apa hari ini?\""}, {"s": "Lina", "t": "\"Aku bawa nasi uduk, resep keluarga dari Betawi.\""}, {"s": "Made", "t": "\"Kalau aku bawa ayam betutu, khas Bali.\""}, {"s": "Rizal", "t": "\"Aku tidak makan itu, aku harus pilih makanan yang halal.\""}, {"s": "Maria", "t": "\"Aku juga tidak makan daging hari ini karena sedang menjalankan ibadah.\""}, {"s": "Andi", "t": "\"Wah, ternyata kita berbeda-beda ya.\""}, {"s": "Lina", "t": "\"Iya, tapi justru seru. Kita bisa saling mengenal budaya masing-masing.\""}, {"s": "Made", "t": "\"Bahkan pekerjaan orang tua kita juga berbeda-beda.\""}, {"s": "Rizal", "t": "\"Yang penting kita saling menghargai.\""}, {"s": "Maria", "t": "\"Perbedaan bukan untuk dipermasalahkan, tapi dipahami.\""}, "Sumber : https://id.scribd.com/document/891794767/SIBI-Nonteks"], "stem": "Jika dilihat dari perspektif sosial, percakapan tersebut mencerminkan bahwa keberagaman ….", "opts": ["menjadi penghambat interaksi sosial satu sama lain", "harus diseragamkan agar tidak memicu timbulnya konflik", "dapat memperkuat hubungan jika dikelola dengan sikap toleran", "tidak berpengaruh dalam kehidupan sehari-hari", "hanya berlaku dalam konteks tertentu di kehidupan sehari-hari"], "key": "C", "pem": "Para tokoh menghargai perbedaan makanan, budaya, dan ibadah dengan sikap toleran (“yang penting kita saling menghargai”). Ini menunjukkan keberagaman memperkuat hubungan jika dikelola dengan toleransi."}, {"n": 27, "inst": "Bacalah penggalan teks drama berikut dengan saksama !", "kind": "drama", "stim": ["Pilihan yang Tepat", {"s": "Dika", "t": "\"Aku tidak mau satu kelompok dengan Rendi lagi.\""}, {"s": "Nina", "t": "\"Kenapa? Bukankah dia sudah berusaha membantu?\""}, {"s": "Dika", "t": "\"Iya, tapi caranya berbeda dan sering tidak sesuai dengan caraku.\""}, {"s": "Rendi", "t": "(pelan) \"Aku hanya mencoba memberikan ide terbaikku.\""}, {"s": "Nina", "t": "\"Bukankah perbedaan cara justru bisa membuat hasil lebih baik?\""}, {"s": "Dika", "t": "\"Aku merasa itu malah memperlambat pekerjaan.\""}, {"s": "Rendi", "t": "\"Kalau kita saling mendengarkan, mungkin kita bisa menemukan cara yang lebih baik.\""}, {"s": "Nina", "t": "\"Yang penting bukan siapa yang benar, tapi bagaimana kita bisa bekerja sama.\""}, "(Dika terdiam dan mulai berpikir.)", "Sumber : https://id.scribd.com/document/515189344/Rasa-Yang-Terhenti-Autosaved"], "stem": "Pesan moral utama yang dapat diambil dari penggalan drama tersebut adalah…", "opts": ["Perbedaan cara kerja harus dihindari agar pekerjaan cepat selesai.", "Setiap individu sebaiknya mempertahankan pendapatnya sendiri.", "Perbedaan pendapat dapat disatukan melalui komunikasi yang baik.", "Kerja kelompok sebaiknya dihindari karena sering menimbulkan konflik.", "Keputusan terbaik ditentukan oleh satu orang dalam kelompok."], "key": "C", "pem": "Konflik Dika dan Rendi mereda melalui saling mendengarkan dan bekerja sama. Pesan moralnya adalah perbedaan pendapat dapat disatukan melalui komunikasi yang baik."}, {"n": 28, "inst": "Bacalah penggalan teks drama berikut dengan saksama !", "kind": "drama", "stim": ["Pilihan yang Tepat", {"s": "Dika", "t": "\"Aku tidak mau satu kelompok dengan Rendi lagi.\""}, {"s": "Nina", "t": "\"Kenapa? Bukankah dia sudah berusaha membantu?\""}, {"s": "Dika", "t": "\"Iya, tapi caranya berbeda dan sering tidak sesuai dengan caraku.\""}, {"s": "Rendi", "t": "(pelan) \"Aku hanya mencoba memberikan ide terbaikku.\""}, {"s": "Nina", "t": "\"Bukankah perbedaan cara justru bisa membuat hasil lebih baik?\""}, {"s": "Dika", "t": "\"Aku merasa itu malah memperlambat pekerjaan.\""}, {"s": "Rendi", "t": "\"Kalau kita saling mendengarkan, mungkin kita bisa menemukan cara yang lebih baik.\""}, {"s": "Nina", "t": "\"Yang penting bukan siapa yang benar, tapi bagaimana kita bisa bekerja sama.\""}, "(Dika terdiam dan mulai berpikir.)", "Sumber : https://id.scribd.com/document/515189344/Rasa-Yang-Terhenti-Autosaved"], "stem": "Relevansi pesan moral dalam drama tersebut dengan kehidupan nyata adalah…", "opts": ["Tidak memiliki kaitan dengan kehidupan sehari-hari", "Hanya berlaku dalam kegiatan belajar di sekolah", "Pentingnya sikap saling menghargai dalam kerja sama sosial", "Menunjukkan bahwa konflik tidak dapat dihindari", "Menjelaskan bahwa perbedaan selalu menimbulkan masalah"], "key": "C", "pem": "Dalam kehidupan nyata, kerja sama selalu melibatkan orang yang berbeda cara dan pendapat. Pesan yang relevan adalah pentingnya sikap saling menghargai dalam kerja sama sosial."}, {"n": 29, "inst": "Bacalah penggalan teks drama berikut !", "kind": "drama", "stim": ["Di Balik Layar", {"s": "Arga", "t": "(pelan) \"Mengapa peran ini terasa begitu berat?\""}, "(Maya masuk perlahan, berdiri di belakang Arga tanpa disadari.)", {"s": "Maya", "t": "\"Karena kamu tidak hanya memerankan tokoh itu, tapi juga memahami perasaannya.\""}, {"s": "Arga", "t": "\"Aku takut tidak bisa menyampaikan maknanya kepada penonton.\""}, {"s": "Maya", "t": "\"Penonton tidak hanya melihat gerakanmu, mereka merasakan kejujuranmu.\""}, "(Arga menatap panggung kosong, lalu berdiri perlahan.)", {"s": "Arga", "t": "\"Jadi… aku harus menjadi dirinya, bukan sekadar memerankannya?\""}, {"s": "Maya", "t": "(tersenyum) \"Tepat sekali.\""}, "(Lampu perlahan menyala terang, Arga berjalan ke tengah panggung dengan ekspresi lebih yakin.)", "Sumber : https://share.google/aimode/kAV4fgl2YUPJ3VhRv"], "stem": "Makna simbolik dari “panggung kosong” yang ditatap Arga adalah…", "opts": ["Ruang refleksi untuk memahami peran secara mendalam", "Ketiadaan penonton saat latihan berlangsung", "Tidak adanya properti dalam pertunjukan drama", "Kesalahan dalam pengaturan panggung pertunjukan", "Kondisi panggung yang belum siap digunakan"], "key": "A", "pem": "Arga menatap panggung kosong sebelum yakin untuk memerankan tokohnya. Panggung kosong melambangkan ruang untuk merenung dan memahami peran secara mendalam."}, {"n": 30, "inst": "Bacalah penggalan teks drama berikut !", "kind": "drama", "stim": ["Di Balik Layar", {"s": "Arga", "t": "(pelan) \"Mengapa peran ini terasa begitu berat?\""}, "(Maya masuk perlahan, berdiri di belakang Arga tanpa disadari.)", {"s": "Maya", "t": "\"Karena kamu tidak hanya memerankan tokoh itu, tapi juga memahami perasaannya.\""}, {"s": "Arga", "t": "\"Aku takut tidak bisa menyampaikan maknanya kepada penonton.\""}, {"s": "Maya", "t": "\"Penonton tidak hanya melihat gerakanmu, mereka merasakan kejujuranmu.\""}, "(Arga menatap panggung kosong, lalu berdiri perlahan.)", {"s": "Arga", "t": "\"Jadi… aku harus menjadi dirinya, bukan sekadar memerankannya?\""}, {"s": "Maya", "t": "(tersenyum) \"Tepat sekali.\""}, "(Lampu perlahan menyala terang, Arga berjalan ke tengah panggung dengan ekspresi lebih yakin.)", "Sumber : https://share.google/aimode/kAV4fgl2YUPJ3VhRv"], "stem": "Jika Arga tidak memahami makna perannya, dampak yang paling mungkin adalah…", "opts": ["Pertunjukan tetap berjalan tanpa perubahan makna", "Penonton kesulitan merasakan emosi yang ingin disampaikan", "Alur cerita menjadi lebih sederhana untuk dipahami", "Penonton lebih fokus pada dekorasi panggung", "Dialog menjadi lebih menarik untuk didengarkan"], "key": "B", "pem": "Maya menyatakan bahwa penonton merasakan kejujuran pemain. Jika Arga tidak memahami makna perannya, penonton sulit merasakan emosi yang ingin disampaikan."}, {"n": 31, "inst": "Bacalah teks berikut !", "kind": "prose", "stim": ["Dalam sebuah pertunjukan drama sekolah, ditampilkan kisah tentang sekelompok siswa yang awalnya tidak mau bekerja sama karena perbedaan latar belakang. Salah satu tokoh selalu memaksakan pendapatnya, sementara tokoh lain memilih diam. Konflik semakin memuncak hingga akhirnya mereka menyadari bahwa tanpa saling mendengarkan dan menghargai perbedaan, tujuan bersama tidak akan tercapai. Di akhir pertunjukan, mereka mulai berdiskusi dengan lebih terbuka dan saling menghargai."], "stem": "Makna moral dari konflik yang terjadi dalam pertunjukan tersebut adalah…", "opts": ["Perbedaan harus dihilangkan agar tidak menimbulkan masalah", "Konflik menunjukkan bahwa kerja kelompok tidak diperlukan", "Konflik dapat menjadi sarana pembelajaran dalam kerja sama", "Perbedaan selalu menimbulkan kerugian dalam kelompok", "Setiap individu sebaiknya bekerja secara mandiri"], "key": "C", "pem": "Konflik dalam pertunjukan menyadarkan para tokoh pentingnya saling mendengarkan dan menghargai. Maknanya adalah konflik dapat menjadi sarana pembelajaran dalam kerja sama."}, {"n": 32, "inst": "Bacalah dialog berikut dengan saksama!", "kind": "drama", "stim": ["Suara yang Terabaikan", "(Latar: Ruang kelas setelah diskusi kelompok.)", {"s": "Fajar", "t": "\"Kita pakai ideku saja, supaya cepat selesai.\""}, {"s": "Lukman", "t": "\"Tapi ide Rani juga bagus, kenapa tidak dipertimbangkan?\""}, {"s": "Fajar", "t": "\"Kalau terlalu banyak pendapat, nanti malah membingungkan.\""}, {"s": "Rani", "t": "(pelan) \"Aku hanya ingin memberi kontribusi.\""}, {"s": "Lukman", "t": "\"Semua orang berhak didengar dalam kelompok ini.\""}, {"s": "Fajar", "t": "(diam sejenak) \"Mungkin aku terlalu memaksakan pendapatku.\""}, {"s": "Rani", "t": "\"Yang penting kita bisa bekerja sama dengan baik.\""}, "(Mereka mulai berdiskusi kembali dengan lebih tenang.)", "Sumber :https://repositori.kemendikdasmen.go.id/.pdf"], "stem": "Pesan moral dari pernyataan Lukman menunjukkan bahwa…", "opts": ["Setiap anggota kelompok memiliki hak untuk menyampaikan pendapatnya.", "Diskusi kelompok hanya efektif jika dipimpin oleh satu orang.", "Perbedaan pendapat dapat memperlambat penyelesaian tugas.", "Keputusan terbaik berasal dari pendapat yang paling kuat.", "Konflik dalam kelompok tidak perlu diselesaikan secara bersama."], "key": "A", "pem": "Lukman berkat     if (typeof b[0] === "string" && b[0] && !/:$/.test(b[0]) && typeof b[1] === "string" && /^\(\s*karya/i.test(b[1])) {
      box.append(h("div", { class: "ttl", text: b[0] }), h("p", { class: "au", text: b[1].replace(/^\(\s*/, "(").replace(/\s*:\s*/, ": ") }));
      i = 2;
    }
    let cur = [];
    const flush = () => { if (cur.length) { const p = h("p", { class: "stz" }); cur.forEach((t, k) => { if (k) p.append(h("br")); p.append(t); }); box.append(p); cur = []; } };
    for (; i < b.length; i++) {
      const t = b[i];
      if (t === "") { flush(); continue; }
      if (/^Puisi \d+\s*:$/.test(t)) { flush(); box.append(h("p", { class: "lbl", text: t.replace(":", "") })); continue; }
      cur.push(t);
    }
    flush();
  } else if (q.kind === "drama") {
    let i = 0;
    if (typeof b[0] === "string" && !b[0].startsWith("(")) { box.append(h("div", { class: "ttl", text: b[0] })); i = 1; }
    for (; i < b.length; i++) {
      const t = b[i];
      if (t === "") continue;
      if (typeof t === "object") box.append(h("div", { class: "dl" }, h("b", { text: t.s }), h("span", { text: t.t })));
      else if (isSrc(t)) box.append(h("p", { class: "src", text: t }));
      else if (t.startsWith("(")) box.append(h("p", { class: "sd", text: t }));
      else {
        const m = t.match(/^([^:]{2,24}?)\s*:\s*(.+)$/);
        if (m) box.append(h("div", { class: "dl" }, h("b", { text: m[1] }), h("span", { text: m[2] })));
        else box.append(h("p", { class: "pr", text: t }));
      }
    }
  } else {
    b.filter(t => t !== "").forEach(t => box.append(isSrc(t) ? h("p", { class: "src", text: t }) : h("p", { class: "pr", text: typeof t === "string" ? t : t.s + ": " + t.t })));
  }
  return box;
}

function viewExam() {
  X = {};
  X.timer = h("div", { class: "timer", role: "timer", "aria-label": "Sisa waktu" }, ico("clock"), h("div", null, h("small", { text: "Sisa waktu" }), h("div", { class: "t", id: "tm", text: fmtTime(remaining()) })));
  X.bar = h("i");
  const top = h("header", { class: "top" },
    h("div", { class: "in" },
      h("div", { class: "logo" }, h("div", { class: "mark", text: "TO" }), h("div", { style: "min-width:0" }, h("b", { text: "Try Out TKA" }), h("span", { class: "s", text: "Bahasa Indonesia · Kelas XI" }))),
      h("div", { class: "who" }, h("b", { text: S.ident.nama }), h("span", { text: `${S.ident.kelas} · ${S.ident.sekolah}` })),
      X.timer),
    h("div", { class: "progress", "aria-hidden": "true" }, X.bar));

  X.qcard = h("section", { class: "qcard", "aria-live": "off" });
  X.prev = h("button", { class: "btn btn-ghost", type: "button", onclick: () => go(S.cur - 1) }, ico("left"), h("span", null, "Sebelumnya"));
  X.dbt = h("button", { class: "btn btn-doubt", type: "button", onclick: toggleDoubt, "aria-pressed": "false" }, ico("flag"), h("span", { id: "dbt-l", text: "Ragu-ragu" }));
  X.next = h("button", { class: "btn btn-primary", type: "button", onclick: () => S.cur === TOTAL - 1 ? confirmFinish() : go(S.cur + 1) }, h("span", { id: "nx-l", text: "Selanjutnya" }), ico("right"));
  const actions = h("div", { class: "actions" }, X.prev, X.dbt, X.next);

  X.ngrid = h("div", { class: "ngrid", role: "group", "aria-label": "Navigasi nomor soal" });
  X.legc = {};
  const leg = h("ul", { class: "leg" },
    [["done", "Sudah dijawab"], ["doubt", "Ragu-ragu"], ["blank", "Belum dijawab"]].map(([k, t]) => h("li", null, h("i", { class: k }), t, (X.legc[k] = h("b")))),
    h("li", null, h("i", { class: "cur" }), "Soal yang sedang dibuka"));
  X.prog = h("span");
  const ncol = h("aside", { class: "ncol" },
    h("div", { class: "ncard" }, h("h2", null, "Navigasi Soal", X.prog), X.ngrid, leg),
    h("button", { class: "btn btn-ok", type: "button", onclick: confirmFinish }, ico("check"), "Selesai & Kumpulkan"));

  $("#app").append(top, h("main", { class: "in exam" }, h("div", { class: "qcol" }, X.qcard, actions), ncol));
  buildNav(); renderQuestion(); refresh();
  tickTimer(); tick = setInterval(tickTimer, 250);
}
function tickTimer() {
  const r = remaining();
  const el = $("#tm"); if (el) el.textContent = fmtTime(r);
  X.timer.classList.toggle("warn", r <= 600 && r > 300);
  X.timer.classList.toggle("crit", r <= 300);
  if (r <= 0) finish(true);
}
function buildNav() {
  X.nbtn = [];
  for (let i = 0; i < TOTAL; i++) {
    const b = h("button", { class: "n", type: "button", text: i + 1, onclick: () => go(i) });
    X.nbtn.push(b); X.ngrid.append(b);
  }
}
function renderQuestion() {
  const q = Q[S.cur];
  X.status = h("span", { class: "status" }, h("i"), h("span"));
  const stimwrap = h("div", { class: "stimwrap" }, h("div", { class: "stimlabel", text: q.inst }), renderStim(q));
  X.opts = q.opts.map((t, i) => h("button", { class: "opt", type: "button", role: "radio", "aria-checked": "false", onclick: () => pick(i) }, h("span", { class: "lt", text: L5[i] }), h("span", { class: "tx", text: t })));
  X.clear = h("button", { class: "link clear", type: "button", onclick: () => { delete S.ans[S.cur]; store.save(); refresh(); } }, "Hapus pilihan");
  const ans = h("div", { class: "ansp" }, h("p", { class: "stem", text: q.stem }), h("div", { class: "opts", role: "radiogroup", "aria-label": "Pilihan jawaban" }, X.opts), X.clear);
  X.qcard.replaceChildren(
    h("div", { class: "qhead" }, h("div", { class: "qno" }, h("span", { class: "qnum", text: q.n }), h("span", { class: "qof", text: `dari ${TOTAL} soal` })), X.status),
    h("div", { class: "qbody split" }, stimwrap, ans));
}
function refresh() {
  const i = S.cur, a = S.ans[i], st = statusOf(i), c = counts();
  X.opts.forEach((o, k) => { const on = a === L5[k]; o.classList.toggle("sel", on); o.setAttribute("aria-checked", on); });
  X.clear.hidden = !a;
  X.status.className = "status " + (st === "blank" ? "" : st);
  X.status.lastChild.textContent = st === "doubt" ? "Ragu-ragu" : st === "done" ? "Sudah dijawab" : "Belum dijawab";
  const d = !!S.doubt[i];
  X.dbt.classList.toggle("on", d); X.dbt.setAttribute("aria-pressed", d);
  $("#dbt-l").textContent = d ? "Ragu-ragu ✓" : "Ragu-ragu";
  X.prev.disabled = i === 0;
  const last = i === TOTAL - 1;
  $("#nx-l").textContent = last ? "Selesai" : "Selanjutnya";
  X.nbtn.forEach((b, k) => {
    const s = statusOf(k);
    b.className = "n" + (s === "blank" ? "" : " " + s) + (k === i ? " cur" : "");
    b.setAttribute("aria-label", `Soal ${k + 1}, ${s === "done" ? "sudah dijawab" : s === "doubt" ? "ragu-ragu" : "belum dijawab"}`);
    if (k === i) b.setAttribute("aria-current", "step"); else b.removeAttribute("aria-current");
  });
  X.legc.done.textContent = c.d; X.legc.doubt.textContent = c.r; X.legc.blank.textContent = c.b;
  X.prog.textContent = `${answeredN()}/${TOTAL} terjawab`;
  X.bar.style.width = (answeredN() / TOTAL * 100) + "%";
}
function pick(k) { S.ans[S.cur] = L5[k]; store.save(); refresh(); }
function toggleDoubt() { if (S.doubt[S.cur]) delete S.doubt[S.cur]; else S.doubt[S.cur] = true; store.save(); refresh(); }
function go(i) { if (i < 0 || i >= TOTAL) return; S.cur = i; store.save(); renderQuestion(); refresh(); window.scrollTo(0, 0); }

function confirmFinish() {
  const c = counts();
  const body = h("div", { style: "display:grid;gap:14px" },
    h("div", { class: "sum" },
      h("div", { class: "a" }, h("b", { text: c.d }), "Dijawab"),
      h("div", { class: "b" }, h("b", { text: c.r }), "Ragu-ragu"),
      h("div", { class: "c" }, h("b", { text: c.b }), "Belum")),
    h("p", { text: c.b + c.r > 0 ? `Masih ada ${c.b} soal belum dijawab dan ${c.r} soal ragu-ragu. Sisa waktu ${fmtTime(remaining())}.` : "Semua soal sudah dijawab. Kumpulkan sekarang?" }));
  modal("Kumpulkan jawaban?", body, [
    h("button", { class: "btn btn-ghost", type: "button", onclick: closeModal }, "Kembali"),
    h("button", { class: "btn btn-ok", type: "button", onclick: () => { closeModal(); finish(false); } }, "Kumpulkan")]);
}
function finish(auto) {
  if (S.phase !== "exam") return;
  closeModal();
  S.phase = "result"; S.auto = !!auto;
  S.doneAt = auto ? Math.min(Date.now(), S.endAt) : Date.now();
  store.save(); route();
}

/* ---------- 3. hasil ---------- */
function viewResult() {
  const R = result(), id = S.ident;
  const used = Math.max(0, Math.min(DURATION, Math.round((S.doneAt - S.startAt) / 1000)));
  const circ = 2 * Math.PI * 80;
  const tone = R.score >= 75 ? "hi" : R.score >= 55 ? "mid" : "lo";
  const pred = R.score >= 85 ? "Sangat Baik" : R.score >= 75 ? "Baik" : R.score >= 55 ? "Cukup" : "Perlu Ditingkatkan";
  const col = tone === "hi" ? "var(--ok)" : tone === "mid" ? "var(--doubt)" : "var(--bad)";
  const ring = h("div", { class: "ring", role: "img", "aria-label": `Nilai akhir ${fmtScore(R.score)} dari 100` });
  ring.innerHTML = `<svg viewBox="0 0 188 188"><circle class="bg" cx="94" cy="94" r="80"/><circle class="fg" cx="94" cy="94" r="80" stroke="${col}" stroke-dasharray="${circ}" stroke-dashoffset="${circ * (1 - R.score / 100)}" style="--circ:${circ}"/></svg>`;
  ring.append(h("div", { class: "num" }, h("span", { text: fmtScore(R.score) }), h("small", { text: "dari 100" })));

  const dt = new Date(S.doneAt).toLocaleDateString("id-ID", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
  const mm = Math.floor(used / 60), ss = used % 60;
  const item = (t, v) => h("div", null, h("dt", { text: t }), h("dd", { text: v }));

  const header = h("header", { class: "rhero" }, h("div", { class: "in" },
    h("div", { class: "logo" }, h("div", { class: "mark", text: "TO" }), h("div", null, h("b", { text: "Try Out TKA" }), h("span", { class: "s", text: "Hasil · Bahasa Indonesia · Kelas XI" })))));

  const score = h("section", { class: "scorecard" },
    h("div", { class: "cap", text: "Nilai Akhir" }), ring, h("span", { class: `pred p-${tone}`, text: pred }),
    h("p", { class: "fine", text: S.auto ? "Waktu habis, jawaban dikumpulkan otomatis." : "Jawaban dikumpulkan oleh peserta." }));

  const info = h("section", { class: "info" },
    h("h2", { text: "Identitas Peserta" }),
    h("dl", { class: "idl" }, item("Nama Siswa", id.nama), item("Kelas", id.kelas), item("No. Peserta Didik", id.peserta), item("Asal Sekolah", id.sekolah), item("Waktu Mengerjakan", `${mm} menit ${ss} detik`), item("Tanggal", dt)),
    h("div", { class: "stats" },
      h("div", { class: "stat ok" }, h("b", { text: R.ok }), "Benar"),
      h("div", { class: "stat no" }, h("b", { text: R.no }), "Salah"),
      h("div", { class: "stat bl" }, h("b", { text: R.bl }), "Tidak dijawab")),
    h("div", null, h("div", { class: "stimlabel", text: "Peta hasil per nomor" }),
      h("div", { class: "map" }, R.per.map((s, i) => h("a", { class: s, href: "#pb-" + (i + 1), "aria-label": `Soal ${i + 1}, ${s === "ok" ? "benar" : s === "no" ? "salah" : "tidak dijawab"}`, text: i + 1, onclick: e => { e.preventDefault(); setFilter("all"); const t = $("#pb-" + (i + 1)); if (t) t.scrollIntoView({ block: "start" }); } })))));

  const list = h("div", { id: "pblist" });
  const fbtns = [["all", `Semua (${TOTAL})`], ["no", `Salah (${R.no})`], ["bl", `Kosong (${R.bl})`], ["ok", `Benar (${R.ok})`]].map(([k, t]) => h("button", { type: "button", "data-f": k, "aria-pressed": k === filter, text: t, onclick: () => setFilter(k) }));
  X.R = R; X.list = list; X.fbtns = fbtns;

  const pbh = h("div", { class: "pbh" }, h("h2", { text: "Pembahasan Soal" }), h("div", { class: "filters", role: "group", "aria-label": "Saring pembahasan" }, fbtns));
  const bottom = h("div", { class: "bottom" },
    h("button", { class: "btn btn-ghost", type: "button", onclick: () => window.scrollTo({ top: 0, behavior: "smooth" }) }, "Kembali ke atas"),
    h("button", { class: "btn btn-primary", type: "button", onclick: confirmRetry }, ico("redo"), "Ulangi Try Out"));

  $("#app").append(header, h("main", { class: "in" }, h("div", { class: "res" }, score, info), pbh, list, bottom));
  renderPB();
}
function setFilter(k) { filter = k; X.fbtns.forEach(b => b.setAttribute("aria-pressed", b.dataset.f === k)); renderPB(); }
function renderPB() {
  const R = X.R, out = [];
  Q.forEach((q, i) => {
    const st = R.per[i];

    const a = S.ans[i];
    const opts = q.opts.map((t, k) => {
      const l = L5[k], isKey = l === q.key, isWrong = a === l && !isKey;
      return h("div", { class: "ro" + (isKey ? " key" : isWrong ? " wrong" : "") },
        h("span", { class: "lt", text: l }), h("span", { class: "tx", text: t }),
        (isKey || isWrong) && h("span", { class: "mk", text: isKey ? (a === l ? "Kunci · jawabanmu" : "Kunci") : "Jawabanmu" }));
    });
    out.push(h("article", { class: "pb", id: "pb-" + q.n },
      h("div", { class: "pb-h" },
        h("span", { class: "nm", text: q.n }),
        h("span", { class: "tag " + st, text: st === "ok" ? "Benar" : st === "no" ? "Salah" : "Tidak dijawab" }),
        h("span", { class: "ans" }, "Kunci: ", h("b", { text: q.key }), "  ·  Jawabanmu: ", h("b", { text: a || "–" }))),
      h("div", { class: "pb-b" },
        h("details", null, h("summary", { text: "Lihat bacaan soal" }), renderStim(q)),
        h("p", { class: "stem", style: "margin:0", text: q.stem }),
        h("div", { class: "ropts" }, opts),
        h("div", { class: "expl" }, h("h3", { text: "Pembahasan" }), h("p", { text: q.pem })))));
  });
  X.list.replaceChildren(...(out.length ? out : [h("div", { class: "empty", text: "Tidak ada soal pada kategori ini." })]));
}
function confirmRetry() {
  modal("Ulangi try out?", h("p", { text: "Jawaban dan nilai sekarang akan dihapus. Identitas peserta tetap terisi." }), [
    h("button", { class: "btn btn-ghost", type: "button", onclick: closeModal }, "Batal"),
    h("button", { class: "btn btn-primary", type: "button", onclick: () => { closeModal(); const ident = S.ident; S = blank(); S.ident = ident; filter = "all"; store.save(); route(); } }, "Ulangi")]);
}

/* ---------- keyboard ---------- */
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && !$("#modal").hidden) { closeModal(); return; }
  if (S.phase !== "exam" || !$("#modal").hidden) return;
  if (e.target.closest && e.target.closest("input,textarea")) return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (e.key === "ArrowRight") { go(S.cur + 1); }
  else if (e.key === "ArrowLeft") { go(S.cur - 1); }
  else { const k = L5.indexOf(e.key.toUpperCase()); if (e.key.length === 1 && k >= 0 && k < Q[S.cur].opts.length) pick(k); }
});

/* ---------- mulai ---------- */
(function init() {
  const saved = store.load();
  if (saved) {
    S = Object.assign(blank(), saved);
    if (S.phase === "exam" && S.endAt && Date.now() >= S.endAt) { S.phase = "result"; S.auto = true; S.doneAt = S.endAt; store.save(); }
  }
  route();
})();
</script>
